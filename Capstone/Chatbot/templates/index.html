<!DOCTYPE html>
<html>
	<head>
		<title>Chat</title>
		<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
		<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css" integrity="sha384-B4dIYHKNBt8Bc12p+WXckhzcICo0wtJAoU8YZTY5qE0Id1GSseTk6S+L3BlXeVIU" crossorigin="anonymous">
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
		<link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/malihu-custom-scrollbar-plugin/3.1.5/jquery.mCustomScrollbar.min.css">
		<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/malihu-custom-scrollbar-plugin/3.1.5/jquery.mCustomScrollbar.min.js"></script>
    	<style>
    		body,html{
        			height: 100%;
        			margin: 0;
        			background: #7F7FD5;
        	       background: -webkit-linear-gradient(to right, #91EAE4, #86A8E7, #7F7FD5);
        	        background: linear-gradient(to right, #91EAE4, #86A8E7, #7F7FD5);
        		}

        		.chat{
        			margin-top: auto;
        			margin-bottom: auto;
        		}
        		.card{
        			height: 700px;
        			width:600px;
        			border-radius: 15px !important;
        			background-color: rgba(0,0,0,0.4) !important;
        		}
        		.contacts_body{
        			padding:  0.75rem 0 !important;
        			overflow-y: auto;
        			white-space: nowrap;
        		}
        		.msg_card_body{
        			overflow-y: auto;
        		}
        		.card-header{
        			border-radius: 15px 15px 0 0 !important;
        			border-bottom: 0 !important;
        		}
        	 .card-footer{
        		border-radius: 0 0 15px 15px !important;
        			border-top: 0 !important;
        	}
        		.container{
        			align-content: center;
        		}
        		.search{
        			border-radius: 15px 0 0 15px !important;
        			background-color: rgba(0,0,0,0.3) !important;
        			border:0 !important;
        			color:white !important;
        		}
        		.search:focus{
        		     box-shadow:none !important;
                   outline:0px !important;
        		}
        		.type_msg{
        			background-color: rgba(0,0,0,0.3) !important;
        			border:0 !important;
        			color:white !important;
        			height: 60px !important;
        			overflow-y: auto;
        		}
        			.type_msg:focus{
        		     box-shadow:none !important;
                   outline:0px !important;
        		}
        		.attach_btn{
        	border-radius: 15px 0 0 15px !important;
        	background-color: rgba(0,0,0,0.3) !important;
        			border:0 !important;
        			color: white !important;
        			cursor: pointer;
        		}
        		.send_btn{
        	border-radius: 0 15px 15px 0 !important;
        	background-color: rgba(0,0,0,0.3) !important;
        			border:0 !important;
        			color: white !important;
        			cursor: pointer;
        		}
        		.search_btn{
        			border-radius: 0 15px 15px 0 !important;
        			background-color: rgba(0,0,0,0.3) !important;
        			border:0 !important;
        			color: white !important;
        			cursor: pointer;
        		}
        		.contacts{
        			list-style: none;
        			padding: 0;
        		}
        		.contacts li{
        			width: 100% !important;
        			padding: 5px 10px;
        			margin-bottom: 15px !important;
        		}
        	.active{
        			background-color: rgba(0,0,0,0.3);
        	}
        		.user_img{
        			height: 70px;
        			width: 70px;
        			border:1.5px solid #f5f6fa;
        		
        		}
        		.user_img_msg{
        			height: 40px;
        			width: 40px;
        			border:1.5px solid #f5f6fa;
        		
        		}
        	.img_cont{
        			position: relative;
        			height: 70px;
        			width: 70px;
        	}
        	.img_cont_msg{
        			height: 40px;
        			width: 40px;
        	}
        	.online_icon{
        		position: absolute;
        		height: 15px;
        		width:15px;
        		background-color: #4cd137;
        		border-radius: 50%;
        		bottom: 0.2em;
        		right: 0.4em;
        		border:1.5px solid white;
        	}
        	.offline{
        		background-color: #c23616 !important;
        	}
        	.user_info{
        		margin-top: auto;
        		margin-bottom: auto;
        		margin-left: 15px;
        	}
        	.user_info span{
        		font-size: 20px;
        		color: white;
        	}
        	.user_info p{
        	font-size: 10px;
        	color: rgba(255,255,255,0.6);
        	}
        	.video_cam{
        		margin-left: 50px;
        		margin-top: 5px;
        	}
        	.video_cam span{
        		color: white;
        		font-size: 20px;
        		cursor: pointer;
        		margin-right: 20px;
        	}
        	.msg_cotainer{
        		margin-top: auto;
        		margin-bottom: auto;
        		margin-left: 10px;
        		border-radius: 25px;
        		background-color: #82ccdd;
        		padding: 10px;
        		position: relative;
        	}
        	.msg_cotainer_send{
        		margin-top: auto;
        		margin-bottom: auto;
        		margin-right: 10px;
        		border-radius: 25px;
        		background-color: #78e08f;
        		padding: 10px;
        		position: relative;
        	}
        	.msg_time{
        		position: absolute;
        		left: 0;
        		bottom: -15px;
        		color: rgba(255,255,255,0.5);
        		font-size: 10px;
        	}
        	.msg_time_send{
        		position: absolute;
        		right:0;
        		bottom: -15px;
        		color: rgba(255,255,255,0.5);
        		font-size: 10px;
        	}
        	.msg_head{
        		position: relative;
        	}
        	#action_menu_btn{
        		position: absolute;
        		right: 10px;
        		top: 10px;
        		color: white;
        		cursor: pointer;
        		font-size: 20px;
        	}
        	.action_menu{
        		z-index: 1;
        		position: absolute;
        		padding: 15px 0;
        		background-color: rgba(0,0,0,0.5);
        		color: white;
        		border-radius: 15px;
        		top: 30px;
        		right: 15px;
        		display: none;
        	}
        	.action_menu ul{
        		list-style: none;
        		padding: 0;
        	margin: 0;
        	}
        	.action_menu ul li{
        		width: 100%;
        		padding: 10px 15px;
        		margin-bottom: 5px;
        	}
        	.action_menu ul li i{
        		padding-right: 10px;
        	
        	}
        	.action_menu ul li:hover{
        		cursor: pointer;
        		background-color: rgba(0,0,0,0.2);
        	}

			.card-body{
				overflow-y: auto;
			}
        	@media(max-width: 576px){
        	.contacts_card{
        		margin-bottom: 15px !important;
        	}
        	}
    	</style>
    	
	</head>
	<body>
		<div class="container-fluid h-100">
			<div class="row justify-content-center h-100">
				<div class="col-md-8 col-xl-6 chat">
					<div class="card">
						<div class="card-header msg_head">
							<div class="d-flex bd-highlight">
								<div class="img_cont">
									<img src="https://i.pinimg.com/originals/0c/67/5a/0c675a8e1061478d2b7b21b330093444.gif" class="rounded-circle user_img">
									<span class="online_icon"></span>
								</div>
								<div class="user_info">
									<span>Accident Analyser Bot</span>
								</div>
							</div>
						</div>
						<div class="card-body" id="chat-window">
							<div class="d-flex justify-content-start mb-4">
								<div class="img_cont_msg">
									<img src="https://i.pinimg.com/originals/0c/67/5a/0c675a8e1061478d2b7b21b330093444.gif" class="rounded-circle user_img_msg">
								</div>
								<div class="msg_cotainer">
									Hello, I am Accident Analyser Bot. 
								</div>
							</div>
							<div class="d-flex justify-content-start mb-4">
								<div class="img_cont_msg">
									<img src="https://i.pinimg.com/originals/0c/67/5a/0c675a8e1061478d2b7b21b330093444.gif" class="rounded-circle user_img_msg">
								</div>
								<div class="msg_cotainer">
									Please describe the accident in few words.. 
								</div>
							</div>
							<!--
							<div class="d-flex justify-content-end mb-4">
								<div class="msg_cotainer_send">
                                    Sure... 
								</div>
								<div class="img_cont_msg">
        							 <img class="rounded-circle user_img_msg" src ="https://icons.veryicon.com/png/o/business/multi-color-financial-and-business-icons/user-139.png">
							     </div>
							</div>
							-->
						</div>
						<div class="card-footer">
							<div class="input-group">
								<div class="input-group-append">
									<span class="input-group-text attach_btn"><i class="fas fa-paperclip"></i></span>
								</div>
								<textarea class="form-control type_msg" placeholder="Type your message..." id="textInput"></textarea>
								<div class="input-group-append">
									<button class="input-group-text send_btn" onClick ="getResponse()" id="myBtn"><i class="fas fa-location-arrow"></i></button>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
        <script>
			var input = document.getElementById("textInput");

			// Execute a function when the user presses a key on the keyboard
			input.addEventListener("keypress", function(event) {
			  // If the user presses the "Enter" key on the keyboard
			  if (event.key === "Enter") {
				// Cancel the default action, if needed
				event.preventDefault();
				// Trigger the button element with a click
				document.getElementById("myBtn").click();
			  }
			});

			function getResponse()
			{
				var msgText = input.value;
				if (!msgText) return;
				botResponse(msgText)
			}
			function appendMessage(msgText) {
				const msgHTML =`
				<div class="d-flex justify-content-end mb-4">
							<div class="msg_cotainer_send">
							${msgText}
							</div>
							<div class="img_cont_msg">
									<img class="rounded-circle user_img_msg" src ="https://icons.veryicon.com/png/o/business/multi-color-financial-and-business-icons/user-139.png">
								</div>
						</div>
				`;
				document.getElementById("chat-window").insertAdjacentHTML("beforeend", msgHTML);
				document.getElementById("textInput").value = ""
			}

			function appendResponse(msgText) {
				//   Simple solution for small apps
				const msgHTML =`
				<div class="d-flex justify-content-start mb-4">
											<div class="img_cont_msg">
												<img src="https://i.pinimg.com/originals/0c/67/5a/0c675a8e1061478d2b7b21b330093444.gif" class="rounded-circle user_img_msg">
											</div>
											<div class="msg_cotainer">${msgText}</div>
										</div>
				`;
				document.getElementById("chat-window").insertAdjacentHTML("beforeend", msgHTML);
				document.getElementById("textInput").value = ""
			}

			function botResponse(rawText) {
				// Bot Response
				appendMessage(rawText);
				appendResponse("Please wait while we analyze the accident discription..... ");
				$.get("/get", { msg: rawText }).done(function (data) {
					console.log(rawText);
					console.log(data);
					var response = 'Our Prediction: ';
					appendResponse(response.concat(data));
				});
				}
      </script>

	</body>
</html>
